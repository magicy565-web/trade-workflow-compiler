services:
  twc:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      TWC_DATA_DIR: /app/data
      TWC_SCHEDULER: embedded
    volumes:
      - twc-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  twc-data:
